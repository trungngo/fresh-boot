# yaml-language-server: $schema=https://github.com/trungngo/dot-cli/releases/latest/download/bundle.schema.json
#
# The GitLab CLI, installed and nothing more: it never stops to ask. Logging in is left to you
# (`glab auth login`, README.md); no token is stored in this repository or exported into shells,
# and GITLAB_TOKEN is never set.
name: glab
description: GitLab CLI
requires: [common]

steps:
  - label: glab completion for zsh
    when: { os: "!windows" }
    link:
      ~/.config/zsh/conf.d/glab.zsh: glab.zsh

  # By OS, not by the `pkg` fact: on a fresh Mac (and over --host) Homebrew is not on the
  # starting PATH, so `pkg` is not `brew` yet when the run is planned; the common bundle
  # installs it, and the step finds it when it runs. Each OS uses its own manager's entry.
  - label: Install glab (Homebrew, winget)
    when: { os: [macos, windows] }
    package:
      brew: [glab]
      winget: [GLab.GLab]

  # Debian/Ubuntu: GitLab publishes a .deb per release but no apt repository, and Ubuntu's own
  # package is dozens of releases behind, so: the latest release's .deb from gitlab.com.
  - label: Install glab (latest release .deb from gitlab.com)
    when: { pkg: apt }
    github_release:
      source: gitlab
      repo: gitlab-org/cli
      package: glab
